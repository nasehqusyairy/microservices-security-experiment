# SECURE configuration - for Phase 2 with all mitigations active
# Run: docker-compose -f docker-compose.secure.yml up

services:
  mysql:
    image: mysql:8.4
    container_name: mse-mysql
    restart: unless-stopped
    profiles:
      - legacy
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mse}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - microservices-net

  mysql-experiment:
    image: mysql:8.4
    container_name: mse-mysql-experiment
    restart: unless-stopped
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: mse
    volumes:
      - mysql-experiment-data:/var/lib/mysql
      - ./database/init-mysql-compose.sql:/docker-entrypoint-initdb.d/10-replay-experiment.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - microservices-net

  redis:
    image: redis:7-alpine
    container_name: mse-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - microservices-net

  auth-service:
    build: ./auth-service
    command: node server-secure.js
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret}
      ORDER_SERVICE_SECRET: ${ORDER_SERVICE_SECRET:-local-development-order-secret}
      NODE_ENV: ${NODE_ENV:-production}
    networks:
      - microservices-net

  order-service:
    build: ./order-service
    command: node server-secure.js
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret}
      NODE_ENV: ${NODE_ENV:-production}
      MYSQL_HOST: mysql-experiment
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mse}
      MYSQL_USER: mse_runner
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-10}
      MYSQL_CONNECT_TIMEOUT_MS: ${MYSQL_CONNECT_TIMEOUT_MS:-5000}
    volumes:
      - ./certs:/app/../certs:ro
    networks:
      - microservices-net
    depends_on:
      auth-service:
        condition: service_started
      mysql-experiment:
        condition: service_healthy

  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret}
      NODE_ENV: ${NODE_ENV:-production}
    networks:
      - microservices-net
    depends_on:
      - auth-service
      - order-service

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - microservices-net
    depends_on:
      - gateway

volumes:
  mysql-data:
  mysql-experiment-data:

networks:
  microservices-net:
    driver: bridge
