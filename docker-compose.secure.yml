version: "3.8"

# SECURE configuration - for Phase 2 with all mitigations active
# Run: docker-compose -f docker-compose.secure.yml up

services:
  auth-service:
    build: ./auth-service
    command: node server-secure.js
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=UltraSecureSecret123!XYZ
      - ORDER_SERVICE_SECRET=SecureOrderSecret!456
      - NODE_ENV=production
    networks:
      - microservices-net

  order-service:
    build: ./order-service
    command: node server-secure.js
    ports:
      - "4000:4000"
    environment:
      - JWT_SECRET=UltraSecureSecret123!XYZ
      - NODE_ENV=production
    volumes:
      - ./certs:/app/../certs:ro
    networks:
      - microservices-net
    depends_on:
      - auth-service

  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    environment:
      - JWT_SECRET=UltraSecureSecret123!XYZ
      - NODE_ENV=production
    networks:
      - microservices-net
    depends_on:
      - auth-service
      - order-service

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - microservices-net
    depends_on:
      - gateway

networks:
  microservices-net:
    driver: bridge
