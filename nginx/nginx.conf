# EDGE TLS ONLY.
# This file terminates TLS for EXTERNAL clients hitting the system from
# outside the Docker network (client -> nginx). It presents a server
# certificate and does NOT request or verify a client certificate, so this
# hop is HTTPS, not mTLS. Genuine mutual TLS in this system happens one hop
# further in, between the gateway and the order-service (see
# gateway/server.js). Do not describe this file, on its own, as "mTLS".
events {
    worker_connections 1024;
}

http {
    # Redirect HTTP to HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS reverse proxy for API Gateway (edge TLS termination)
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/order.pem;
        ssl_certificate_key /etc/nginx/certs/order.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;

        location / {
            proxy_pass         http://gateway:5000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
